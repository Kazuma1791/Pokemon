        function drawCardFromSet(setCards) {
            if (!setCards || setCards.length === 0) return null;
            const availableRarities = Array.from(new Set(setCards.map(c => c.rarity)));
            const totalRate = availableRarities.reduce((sum, r) => sum + (RARITY[r] ? RARITY[r].rate : 0.01), 0);
            const rand = Math.random() * totalRate;
            let cum = 0, rarity = availableRarities[0];

            for (let r of availableRarities) {
                cum += RARITY[r] ? RARITY[r].rate : 0.01;
                if (rand <= cum) { rarity = r; break; }
            }

            let pool = setCards.filter(c => c.rarity === rarity);
            if (!pool || pool.length === 0) pool = setCards;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        window.showDropRates = function(setId, packTitle) {
            const setCards = CARD_SETS[setId] || [];
            if (setCards.length === 0) return alert("機率載入中...");
            
            const availableRarities = Array.from(new Set(setCards.map(c => c.rarity)));
            const totalRate = availableRarities.reduce((sum, r) => sum + (RARITY[r] ? RARITY[r].rate : 0), 0);
            
            let rateText = `📊 【${packTitle}】官方機率公示：\n\n`;
            
            availableRarities.sort((a, b) => (RARITY[a]?.rate || 1) - (RARITY[b]?.rate || 1));
            
            availableRarities.forEach(r => {
                const config = RARITY[r];
                if (config) {
                    const pct = ((config.rate / totalRate) * 100).toFixed(3);
                    const count = setCards.filter(c => c.rarity === r).length;
                    rateText += `[${r}] 抽中機率: ${pct}% (共 ${count} 張)\n`;
                }
            });
            rateText += `\n* 註：機率為單張卡片獨立計算`;
            alert(rateText);
        };

        window.handleAuthSubmit = async function() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            let rawUsername = document.getElementById('authUsername').value.trim() || '訓練家';
            let cleanedUsername = rawUsername.replace(/<[^>]*>?/gm, '').replace(/https?:\/\/[^\s]+/g, '').trim();
            if (!cleanedUsername) cleanedUsername = "訓練家";

            const forbiddenWords = ['管理員', 'admin', '系統', '官方', '版主', '站長'];
            const lowerName = cleanedUsername.toLowerCase();
            if (isRegisterMode && forbiddenWords.some(word => lowerName.includes(word))) {
                return alert("⚠️ 警告：註冊暱稱包含官方保留字眼（如管理員、系統等），請換一個名字！");
            }

            const primaryBtn = document.getElementById('authPrimaryBtn');
            if (!email || !password) return alert("請輸入完整的 Email 與密碼！");
            if (isRegisterMode && password.length < 6) return alert("密碼長度至少需要 6 位數！");
            if (primaryBtn) primaryBtn.disabled = true;

            try {
                if (isRegisterMode) {
                    const qName = query(collection(db, "users"), where("name", "==", cleanedUsername));
                    const nameSnap = await getDocs(qName);
                    if (!nameSnap.empty && cleanedUsername !== "訓練家") {
                        if (primaryBtn) primaryBtn.disabled = false;
                        return alert(`⚠️ 抱歉，名稱「${cleanedUsername}」已經被其他玩家搶先註冊了，請換一個更響亮的名字吧！`);
                    }

                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    if (res && res.user) {
                        const initialData = {
                            name: cleanedUsername,
                            titles: ["🔰 新手訓練家"],
                            currentTitle: "🔰 新手訓練家",
                            points: INITIAL_GIFT_POINTS,
                            isVip: false,
                            isBanned: false,
                            cards: {},

                            totalPulledValue: 0
                        };

                        currentUserDoc = initialData;
                    }
                    alert("🎉 帳號註冊成功！");
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (err) {
                alert("操作失敗：" + err.message);
            } finally {
                if (primaryBtn) primaryBtn.disabled = false;
            }

            const choiceBox = document.getElementById('animStepChoice');
            if (choiceBox) choiceBox.classList.add('pointer-events-none', 'opacity-50');

                let pulledCards = [];
                let batchPulledValue = 0;

                for (let i = 0; i < cardCount; i++) {
                    const card = drawCardFromSet(setCards);
                    if (card) {
                        pulledCards.push(card);
                        batchPulledValue += RARITY[card.rarity].price;
                    }
                }

                const preloadPromises = pulledCards.map(c => new Promise(resolve => {
                    if (!c.image) return resolve();
                    const img = new Image();
                    img.src = c.image;
                    img.onload = resolve;
                    img.onerror = resolve; 
                }));
                await Promise.race([
                    Promise.all(preloadPromises),
                    new Promise(res => setTimeout(res, 800))
                ]);

                const updatedCards = { ...(currentUserDoc.cards || {}) };
                pulledCards.forEach(card => {
                    updatedCards[card.id] = (updatedCards[card.id] || 0) + 1;
                });

                const currentPts = (typeof currentUserDoc.points === 'number') ? currentUserDoc.points : INITIAL_GIFT_POINTS;
                const newPoints = currentPts - cost;
                const newTotalSpent = (currentUserDoc.totalSpent || 0) + cost;
                const newTotalPulledValue = (currentUserDoc.totalPulledValue || 0) + batchPulledValue;

                const userRef = doc(db, "users", auth.currentUser.uid);
                
                const updatePromise = setDoc(userRef, {
                    points: newPoints,
                    cards: updatedCards,
                    totalSpent: newTotalSpent,
                    totalPulledValue: newTotalPulledValue
                }, { merge: true });

                await Promise.race([
                    updatePromise,
                    new Promise(res => setTimeout(res, 1500))
                ]);

                window.recordDailyProfit(-cost); 

                try {
                    const topCards = pulledCards.filter(c => ['SAR', 'UR', 'RGB', 'FUR'].includes(c.rarity));
                    for (let rareCard of topCards) {
                        addDoc(collection(db, "broadcasts"), {
                            playerName: currentUserDoc.name || "訓練家",
                            title: currentUserDoc.currentTitle || "🔰 新手訓練家",
                            cardName: rareCard.name,
                            rarity: rareCard.rarity,
                            isVip: currentUserDoc.isVip || false,
                            timestamp: Date.now()
                        }).catch(e=>console.warn("廣播背景延遲", e));
                    }
                } catch (broadcastErr) {}

                currentUserDoc.points = newPoints;
                currentUserDoc.cards = updatedCards;
                currentUserDoc.totalSpent = newTotalSpent;
                currentUserDoc.totalPulledValue = newTotalPulledValue;
                currentPulledCards = pulledCards;

                window.updateUI();

                document.getElementById('animStepChoice').classList.add('hidden');
                document.getElementById('animStepTear').classList.remove('hidden');
                document.getElementById('packVisualTitle').innerText = `${setId.toUpperCase()} (#${packNumber})`;

                setTimeout(() => {
                    document.getElementById('animStepTear').classList.add('hidden');
                    document.getElementById('animStepReveal').classList.remove('hidden');
                    window.renderModalFlipCards(currentPulledCards);
                    window.checkAchievements(); 
                }, 800);

            } catch (err) {
                alert("抽卡失敗，請檢查網路連線: " + err.message);
                document.getElementById('packModal').classList.add('hidden');
            } finally {
                if (choiceBox) choiceBox.classList.remove('pointer-events-none', 'opacity-50');
                unlockUI(); 
            }
        };

            const newBanStatus = !u.isBanned;

                        await setDoc(doc(db, "system", "banned_ips"), { ips: arrayRemove(u.lastIP) }, { merge: true });

                alert(`✅ 執行成功！玩家 ${escapeHTML(u.name)} 狀態已更新為：${newBanStatus ? '【已封禁】' : '【已解封】'}`);

                    const u = docSnap.data();
                    if (u.isAdmin || u.isBanned) continue; 
                    
                    let totalCards = 0;
                    let maxSingleCard = 0;
                    
                    if (u.cards) {
                        Object.keys(u.cards).forEach(id => {
                            totalCards += u.cards[id];
                            if (u.cards[id] > maxSingleCard) maxSingleCard = u.cards[id];
                        });
                    }
                    
                    let reasons = [];
                    
                    if (u.totalSpent !== undefined) {
                        const maxPossible = Math.floor(u.totalSpent / 20);
                        if (totalCards > maxPossible + 15) reasons.push(`卡牌總數溢出`);
                    }

                    if (maxSingleCard >= 99) reasons.push(`單卡數量異常複製`);

                    if ((u.totalSpent === undefined || u.totalSpent < 1000) && u.points > 80000) {
                        reasons.push(`積分來源異常`);
                    }
                    
                    if (reasons.length > 0) {
                        cheaters.push({ uid: docSnap.id, name: u.name, reasons: reasons, ip: u.lastIP });
                        
                        await setDoc(doc(db, "users", docSnap.id), { isBanned: true }, { merge: true });
                        if (u.lastIP) {
                            await setDoc(doc(db, "system", "banned_ips"), { ips: arrayUnion(u.lastIP) }, { merge: true });
                        }
                    }
                }
                
                if (cheaters.length === 0) {
                    resultDiv.innerHTML = '<div class="text-[11px] text-emerald-400 font-bold py-2 text-center bg-emerald-900/20 rounded border border-emerald-800/50">✅ 伺服器目前安全，未發現作弊玩家。</div>';
                } else {
                    resultDiv.innerHTML = `<div class="text-[11px] text-red-500 font-bold py-1 mb-2">🚨 掃描完畢！已自動封鎖以下作弊者與他們的 IP：</div>` + 
                    cheaters.map(c => `
                        <div class="bg-red-950/40 p-2.5 rounded-lg border border-red-800 text-xs mb-2">
                            <div class="font-bold text-red-400 flex items-center justify-between">
                                <span>${escapeHTML(c.name)}</span>
                                <span class="text-[9px] text-slate-500 font-mono">IP: ${c.ip || '未知'}</span>
                            </div>
                            <ul class="text-red-200 list-disc list-inside text-[10px] my-1.5 space-y-0.5 opacity-80">
                                ${c.reasons.map(r => `<li>${r}</li>`).join('')}
                            </ul>
                            <div class="text-center text-[10px] text-red-300 font-bold bg-red-900/50 py-1 rounded">已被雷達自動永久封禁 (含IP)</div>
                        </div>
                    `).join('');
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="text-[11px] text-red-500">掃描失敗: ${e.message}</div>`;
            }
        };

        window.adminToggleVipForSelectedUser = async function() {
            if (checkBanned()) return;
            if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) return alert("⚠️ 警告：非法操作！");
            const selectEl = document.getElementById('adminUserSelect');
            const targetUid = selectEl ? selectEl.value : '';
            if (!targetUid) return alert("請先從選單選擇一名訓練家！");
            const u = allUsersCache.find(x => x.uid === targetUid);
            if (!u) return;
            const newVipStatus = !u.isVip;
            try {
                await setDoc(doc(db, "users", targetUid), { isVip: newVipStatus }, { merge: true });
                alert(`👑 已成功將玩家 ${escapeHTML(u.name)} VIP 狀態更新為：${newVipStatus ? '【已開通 VIP】' : '【普通會員】'}`);
                window.fetchAdminUserList();
                window.fetchGlobalStatsAndLeaderboard();
            } catch (e) { alert("修改 VIP 失敗: " + e.message); }
        };

        window.adminAdjustSelectedUser = async function(delta) {
            if (checkBanned()) return;
            if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) return alert("⚠️ 警告：非法操作！");
            const selectEl = document.getElementById('adminUserSelect');
            const targetUid = selectEl ? selectEl.value : '';
            if (!targetUid) return alert("請先從選單選擇一名訓練家！");
            const u = allUsersCache.find(x => x.uid === targetUid);
            if (!u) return;
            const newPoints = (u.points || 0) + delta;
            try {
                await setDoc(doc(db, "users", targetUid), { points: newPoints }, { merge: true });
                alert(`👑 成功將玩家 ${escapeHTML(u.name)} 分數調整了 ${delta > 0 ? '+'+delta : delta} 分！`);
                window.fetchAdminUserList();
                window.fetchGlobalStatsAndLeaderboard();
            } catch (e) { alert("修改失敗: " + e.message); }
        };

        window.adminClearUserCards = async function() {
            if (checkBanned()) return;
            if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) return alert("⚠️ 警告：非法操作！");
            
            const selectEl = document.getElementById('adminUserSelect');
            const targetUid = selectEl ? selectEl.value : '';
            if (!targetUid) return alert("請先從選單選擇一名訓練家！");
            
            const u = allUsersCache.find(x => x.uid === targetUid);
            if (!u) return;

            if (!confirm(`🚨 終極警告：\n你確定要強制沒收玩家「${u.name}」的所有卡牌嗎？\n這將會把他的卡冊全部歸零，且此操作無法復原！`)) return;

            try {
                await setDoc(doc(db, "users", targetUid), { cards: {} }, { merge: true });
                alert(`🔥 執行完畢！已成功沒收玩家 ${escapeHTML(u.name)} 的所有卡牌。`);
                window.fetchAdminUserList();
                window.fetchGlobalStatsAndLeaderboard();
            } catch (e) {
                alert("清空卡冊失敗: " + e.message);
            }
        };

        window.adminDeleteUserAccount = async function() {
            if (checkBanned()) return;
            if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) return alert("⚠️ 警告：非法操作！");
            
            const selectEl = document.getElementById('adminUserSelect');
            const targetUid = selectEl ? selectEl.value : '';
            if (!targetUid) return alert("請先從選單選擇一名訓練家！");
            
            if (targetUid === ADMIN_UID) return alert("⚠️ 系統保護機制：您不能刪除最高管理員自己的帳號！");

            const u = allUsersCache.find(x => x.uid === targetUid);
            if (!u) return;

            const confirm1 = confirm(`🚨 【極度危險操作】🚨\n\n確定要徹底刪除玩家「${u.name}」的遊戲資料嗎？\n這將會清除他的所有積分、卡牌與稱號，且會從全服排行榜與資料庫中完全消失！\n(此操作無法復原)`);
            if (!confirm1) return;
            
            const confirm2 = prompt(`為了防止誤刪，請輸入該玩家的暱稱「${u.name}」以確認執行：`);
            if (confirm2 !== u.name) {
                return alert("輸入的暱稱不符，已安全取消刪除操作。");
            }

            try {
                await deleteDoc(doc(db, "users", targetUid));
                alert(`💀 執行完畢！玩家 ${escapeHTML(u.name)} 的遊戲存在已從世界中徹底抹除。`);
                
                document.getElementById('selectedUserCard').classList.add('hidden');
                selectEl.value = "";
                window.fetchAdminUserList();
                window.fetchGlobalStatsAndLeaderboard();
            } catch (e) {
                alert("刪除帳號資料失敗: " + e.message);
            }
        };

        window.onload = () => {
            window.switchTab('pack');
        };
    </script>
</body>
</html>
