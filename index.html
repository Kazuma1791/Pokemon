<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶可夢卡牌模擬器 - 雲端帳號版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
        }

        .holo-foil {
            position: relative;
            overflow: hidden;
        }
        
        .holo-foil::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            background: linear-gradient(
                115deg, transparent 20%, rgba(255, 255, 255, 0.4) 40%, rgba(255, 0, 128, 0.3) 50%, rgba(0, 255, 255, 0.3) 60%, transparent 80%
            );
            transform: rotate(25deg);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .holo-foil:hover::after {
            opacity: 1;
            animation: holoShift 2s infinite linear;
        }

        @keyframes holoShift {
            0% { transform: translateY(-30%) rotate(25deg); }
            100% { transform: translateY(30%) rotate(25deg); }
        }

        .card-locked {
            filter: grayscale(100%) brightness(0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- 頂部導覽與帳號狀態欄 -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center border-2 border-white shadow-md">
                    <div class="w-4 h-4 bg-white rounded-full border-2 border-slate-900"></div>
                </div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-red-500 via-yellow-400 to-amber-300 bg-clip-text text-transparent">
                    寶可夢抽卡模擬器
                </h1>
            </div>

            <!-- 玩家雲端資訊 -->
            <div id="userHeaderInfo" class="hidden flex items-center gap-4 bg-slate-900 px-4 py-2 rounded-xl border border-slate-700">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-user text-cyan-400"></i>
                    <span id="displayUsername" class="text-sm font-bold text-white">訓練家</span>
                    <span id="adminBadge" class="hidden bg-amber-500 text-slate-950 text-[10px] font-black px-1.5 py-0.5 rounded">👑 管理員</span>
                </div>
                
                <div class="h-4 w-[1px] bg-slate-700"></div>

                <div class="flex items-center gap-1.5">
                    <i class="fa-solid fa-gem text-cyan-400 animate-pulse"></i>
                    <span id="userPoints" class="text-lg font-black text-cyan-300">0</span>
                    <span class="text-xs text-slate-400">分</span>
                </div>

                <button onclick="handleSignOut()" class="text-xs bg-red-900/60 hover:bg-red-800 text-red-200 px-2 py-1 rounded">
                    登出
                </button>
            </div>

            <!-- 分頁選單 -->
            <nav class="flex gap-2 w-full md:w-auto justify-center">
                <button onclick="switchTab('pack')" id="nav-pack" class="tab-btn px-4 py-1.5 rounded-lg font-bold bg-red-600 text-white shadow">
                    <i class="fa-solid fa-box-open mr-1"></i> 抽卡機
                </button>
                <button onclick="switchTab('binder')" id="nav-binder" class="tab-btn px-4 py-1.5 rounded-lg font-bold bg-slate-700 text-slate-300 hover:bg-slate-600">
                    <i class="fa-solid fa-book-bookmark mr-1"></i> 集卡冊圖鑑
                </button>
                <button onclick="switchTab('sell')" id="nav-sell" class="tab-btn px-4 py-1.5 rounded-lg font-bold bg-slate-700 text-slate-300 hover:bg-slate-600">
                    <i class="fa-solid fa-coins mr-1"></i> 出售卡牌
                </button>
                <!-- 管理員專屬分頁按鈕 -->
                <button id="adminTabBtn" onclick="switchTab('admin')" class="hidden tab-btn px-4 py-1.5 rounded-lg font-bold bg-amber-600/30 text-amber-300 border border-amber-500/50 hover:bg-amber-600/50">
                    <i class="fa-solid fa-screwdriver-wrench mr-1"></i> 管理控制台
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">

        <!-- TAB 1: 抽卡機 -->
        <section id="tab-pack" class="tab-content space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- SV2a -->
                <div class="bg-gradient-to-br from-slate-800 to-indigo-950 p-5 rounded-2xl border border-indigo-500/30 shadow-xl flex gap-4 items-center">
                    <div class="w-28 h-40 bg-gradient-to-tr from-pink-600 to-indigo-600 rounded-xl flex flex-col items-center justify-center p-2 text-center shadow-lg border border-white/20">
                        <span class="text-xs font-black bg-white/20 px-2 py-0.5 rounded-full text-white mb-2">SV2a</span>
                        <i class="fa-solid fa-dragon text-4xl text-amber-300 my-1"></i>
                        <span class="text-sm font-bold text-white">寶可夢 151</span>
                    </div>
                    <div class="flex-1 space-y-3">
                        <h3 class="text-lg font-bold text-white">強化擴充包「寶可夢 151」</h3>
                        <div class="flex gap-2">
                            <button onclick="openPack('sv2a', 1)" class="flex-1 bg-red-600 hover:bg-red-500 py-2.5 rounded-xl font-bold text-sm shadow">單抽 (100分)</button>
                            <button onclick="openPack('sv2a', 10)" class="flex-1 bg-amber-600 hover:bg-amber-500 py-2.5 rounded-xl font-bold text-sm shadow">10連抽 (1000分)</button>
                        </div>
                    </div>
                </div>

                <!-- SV5a -->
                <div class="bg-gradient-to-br from-slate-800 to-emerald-950 p-5 rounded-2xl border border-emerald-500/30 shadow-xl flex gap-4 items-center">
                    <div class="w-28 h-40 bg-gradient-to-tr from-emerald-600 to-teal-800 rounded-xl flex flex-col items-center justify-center p-2 text-center shadow-lg border border-white/20">
                        <span class="text-xs font-black bg-white/20 px-2 py-0.5 rounded-full text-white mb-2">SV5a</span>
                        <i class="fa-solid fa-leaf text-4xl text-emerald-300 my-1"></i>
                        <span class="text-sm font-bold text-white">狂野意志</span>
                    </div>
                    <div class="flex-1 space-y-3">
                        <h3 class="text-lg font-bold text-white">擴充包「狂野意志」</h3>
                        <div class="flex gap-2">
                            <button onclick="openPack('sv5a', 1)" class="flex-1 bg-red-600 hover:bg-red-500 py-2.5 rounded-xl font-bold text-sm shadow">單抽 (100分)</button>
                            <button onclick="openPack('sv5a', 10)" class="flex-1 bg-amber-600 hover:bg-amber-500 py-2.5 rounded-xl font-bold text-sm shadow">10連抽 (1000分)</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 抽卡結果 -->
            <div id="pullResultsArea" class="hidden space-y-4">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <h3 class="text-lg font-bold text-amber-400">獲得卡牌</h3>
                    <button onclick="sellAllDuplicates()" class="text-xs bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg font-bold text-white">售出重複卡</button>
                </div>
                <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"></div>
            </div>
        </section>

        <!-- TAB 2: 集卡冊圖鑑 -->
        <section id="tab-binder" class="tab-content hidden space-y-6">
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-center">
                <select id="binderSetFilter" onchange="renderBinder()" class="bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5 text-sm font-bold text-white">
                    <option value="sv2a">SV2a 寶可夢 151</option>
                    <option value="sv5a">SV5a 狂野意志</option>
                </select>
                <span id="binderProgressText" class="text-cyan-400 font-bold text-sm">0 / 0 (0%)</span>
            </div>
            <div id="binderGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4"></div>
        </section>

        <!-- TAB 3: 出售卡牌 -->
        <section id="tab-sell" class="tab-content hidden space-y-6">
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">卡牌交易所</h3>
                <button onclick="sellAllDuplicates()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-xs font-bold text-white">一鍵賣出重複卡</button>
            </div>
            <div id="sellInventoryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"></div>
        </section>

        <!-- TAB 4: 最高管理員控制台 (僅限你的 UID 可見) -->
        <section id="tab-admin" class="tab-content hidden space-y-6">
            <div class="bg-slate-800 p-6 rounded-2xl border border-amber-500/40 shadow-2xl space-y-6">
                <div class="border-b border-slate-700 pb-3 flex justify-between items-center">
                    <h3 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                        <i class="fa-solid fa-crown"></i> 最高管理員控制面板
                    </h3>
                    <span class="text-xs text-slate-400">UID: eTYTRQFMmZc5Hj8KiH3HZkF77q62</span>
                </div>

                <!-- 快速給自己加分 -->
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3">
                    <h4 class="font-bold text-sm text-slate-200">一鍵給自己發放分數：</h4>
                    <div class="flex flex-wrap gap-3">
                        <button onclick="adminAddOwnPoints(1000)" class="bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-lg text-sm font-bold text-white shadow">+1,000 分</button>
                        <button onclick="adminAddOwnPoints(5000)" class="bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-lg text-sm font-bold text-white shadow">+5,000 分</button>
                        <button onclick="adminAddOwnPoints(50000)" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-bold text-white shadow">+50,000 分 (無限抽卡)</button>
                    </div>
                </div>

                <!-- 幫特定玩家改分數 -->
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3">
                    <h4 class="font-bold text-sm text-slate-200">修改指定玩家的分數：</h4>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="targetUserUid" placeholder="貼上玩家的 Firebase UID..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none text-sm">
                        <input type="number" id="targetUserPoints" placeholder="設定目標分數 (例如: 10000)" class="w-full sm:w-48 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none text-sm">
                        <button onclick="adminSetPlayerPoints()" class="bg-cyan-600 hover:bg-cyan-500 px-6 py-2 rounded-xl text-sm font-bold text-white shadow">更換分數</button>
                    </div>
                    <p class="text-[11px] text-slate-500">※ 玩家的 UID 可在 Firebase Console ➔ Authentication 頁面複製取得。</p>
                </div>
            </div>
        </section>

    </main>

    <!-- 登入 / 註冊彈出面板 -->
    <div id="authModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 max-w-md w-full space-y-4 shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-bold text-center text-amber-400">雲端訓練家登入</h2>
            
            <div class="space-y-3">
                <input type="email" id="authEmail" placeholder="電子郵件 Email" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none">
                <input type="password" id="authPassword" placeholder="密碼" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none">
                <input type="text" id="authUsername" placeholder="訓練家暱稱 (僅註冊時需要)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none">
            </div>

            <div class="space-y-2 pt-2">
                <button onclick="handleAuthSubmit()" id="authPrimaryBtn" class="w-full bg-cyan-600 hover:bg-cyan-500 py-2.5 rounded-xl font-bold text-white shadow">
                    登入帳號
                </button>
                <div class="text-center">
                    <button onclick="toggleAuthMode()" id="authToggleBtn" class="text-xs text-slate-400 hover:text-cyan-400 underline">
                        還沒有帳號？點此切換至「註冊帳號」
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (已嵌入專屬金鑰 pokemon-342c8) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const ADMIN_UID = "eTYTRQFMmZc5Hj8KiH3HZkF77q62"; // 你的最高管理員 UID

        const firebaseConfig = {
            apiKey: "AIzaSyALGt-dWSJLf4Qa03AWoFo22u87LMFErIE",
            authDomain: "pokemon-342c8.firebaseapp.com",
            projectId: "pokemon-342c8",
            storageBucket: "pokemon-342c8.firebasestorage.app",
            messagingSenderId: "569559092008",
            appId: "1:569559092008:web:e979990f913b5c9f359e1d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserDoc = null;
        let isRegisterMode = false;

        // 身分狀態監聽
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('userHeaderInfo').classList.remove('hidden');
                
                // 檢查是否為管理員
                if (user.uid === ADMIN_UID) {
                    document.getElementById('adminBadge').classList.remove('hidden');
                    document.getElementById('adminTabBtn').classList.remove('hidden');
                }

                // 載入資料庫
                const userRef = doc(db, "users", user.uid);
                const snap = await getDoc(userRef);
                
                if (snap.exists()) {
                    currentUserDoc = snap.data();
                    
                    // 每日 500 分補給邏輯
                    const today = new Date().toISOString().split('T')[0];
                    if (currentUserDoc.lastDailyDate !== today) {
                        currentUserDoc.lastDailyDate = today;
                        currentUserDoc.points = (currentUserDoc.points || 0) + 500;
                        await updateDoc(userRef, { points: currentUserDoc.points, lastDailyDate: today });
                        alert("🎉 每日登入福利！雲端發放 500 抽卡積分！");
                    }
                }
                updateUI();
            } else {
                document.getElementById('authModal').classList.remove('hidden');
                document.getElementById('userHeaderInfo').classList.add('hidden');
                document.getElementById('adminBadge').classList.add('hidden');
                document.getElementById('adminTabBtn').classList.add('hidden');
            }
        });

        // 登入/註冊切換
        window.toggleAuthMode = () => {
            isRegisterMode = !isRegisterMode;
            document.getElementById('authTitle').innerText = isRegisterMode ? "註冊新訓練家帳號" : "雲端訓練家登入";
            document.getElementById('authPrimaryBtn').innerText = isRegisterMode ? "註冊並登入" : "登入帳號";
            document.getElementById('authToggleBtn').innerText = isRegisterMode ? "已有帳號？點此登入" : "還沒有帳號？點此切換至「註冊帳號」";
        };

        // 提交驗證
        window.handleAuthSubmit = async () => {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const username = document.getElementById('authUsername').value || '訓練家';

            if (!email || !password) return alert("請輸入完整的 Email 與密碼！");

            try {
                if (isRegisterMode) {
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", res.user.uid), {
                        name: username,
                        points: 1000,
                        lastDailyDate: new Date().toISOString().split('T')[0],
                        cards: {}
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (err) {
                alert("驗證失敗: " + err.message);
            }
        };

        window.handleSignOut = () => signOut(auth);

        // 管理員功能：給自己加分
        window.adminAddOwnPoints = async (amount) => {
            if (!currentUserDoc) return;
            currentUserDoc.points += amount;
            await syncToCloud();
            alert(`👑 管理員指令：成功為自己增加 +${amount.toLocaleString()} 積分！`);
        };

        // 管理員功能：改玩家分數
        window.adminSetPlayerPoints = async () => {
            const targetUid = document.getElementById('targetUserUid').value.trim();
            const newPoints = parseInt(document.getElementById('targetUserPoints').value);

            if (!targetUid || isNaN(newPoints)) return alert("請輸入正確的 UID 與分數數字！");

            try {
                const targetRef = doc(db, "users", targetUid);
                await updateDoc(targetRef, { points: newPoints });
                alert(`👑 成功將 UID [${targetUid}] 的分數修改為: ${newPoints} 分！`);
            } catch (err) {
                alert("修改失敗 (請確認 UID 是否存在): " + err.message);
            }
        };

        // 儲存進度至雲端
        async function syncToCloud() {
            if (!auth.currentUser) return;
            const userRef = doc(db, "users", auth.currentUser.uid);
            await updateDoc(userRef, {
                points: currentUserDoc.points,
                cards: currentUserDoc.cards
            });
            updateUI();
        }

        // 全域遊戲變數與卡牌庫設定
        const RARITY = {
            'C': { price: 10, rate: 0.52, color: '#9ca3af' },
            'U': { price: 25, rate: 0.28, color: '#60a5fa' },
            'R': { price: 60, rate: 0.12, color: '#fbbf24' },
            'RR': { price: 200, rate: 0.05, color: '#f43f5e' },
            'AR': { price: 400, rate: 0.02, color: '#a855f7' },
            'SR': { price: 1000, rate: 0.007, color: '#ec4899' },
            'SAR': { price: 3000, rate: 0.002, color: '#10b981' },
            'UR': { price: 8000, rate: 0.001, color: '#eab308' }
        };

        const CARD_SETS = {
            'sv2a': [
                { id: 'sv2a-001', name: '妙蛙種子', rarity: 'C', image: 'https://images.pokemontcg.io/sv3pt5/1_hires.png' },
                { id: 'sv2a-004', name: '小火龍', rarity: 'C', image: 'https://images.pokemontcg.io/sv3pt5/4_hires.png' },
                { id: 'sv2a-025', name: '皮卡丘', rarity: 'U', image: 'https://images.pokemontcg.io/sv3pt5/25_hires.png' },
                { id: 'sv2a-006', name: '噴火龍 ex', rarity: 'RR', image: 'https://images.pokemontcg.io/sv3pt5/6_hires.png' },
                { id: 'sv2a-199', name: '噴火龍 ex SAR', rarity: 'SAR', image: 'https://images.pokemontcg.io/sv3pt5/199_hires.png' }
            ],
            'sv5a': [
                { id: 'sv5a-001', name: '草苗龜', rarity: 'C', image: 'https://images.pokemontcg.io/sv5/1_hires.png' },
                { id: 'sv5a-030', name: '猛雷鼓 ex', rarity: 'RR', image: 'https://images.pokemontcg.io/sv5/38_hires.png' },
                { id: 'sv5a-101', name: '猛雷鼓 ex SAR', rarity: 'SAR', image: 'https://images.pokemontcg.io/sv5/161_hires.png' }
            ]
        };

        function updateUI() {
            if (!currentUserDoc) return;
            document.getElementById('displayUsername').innerText = currentUserDoc.name;
            document.getElementById('userPoints').innerText = currentUserDoc.points.toLocaleString();
        }

        window.openPack = async (setId, count) => {
            const cost = count * 100;
            if (currentUserDoc.points < cost) return alert("分數不足！");

            currentUserDoc.points -= cost;
            const pulled = [];

            for (let i = 0; i < count * 5; i++) {
                const rand = Math.random();
                let cum = 0, rarity = 'C';
                for (let r in RARITY) {
                    cum += RARITY[r].rate;
                    if (rand <= cum) { rarity = r; break; }
                }
                const set = CARD_SETS[setId];
                const pool = set.filter(c => c.rarity === rarity) || set;
                const card = pool[Math.floor(Math.random() * pool.length)];
                currentUserDoc.cards[card.id] = (currentUserDoc.cards[card.id] || 0) + 1;
                pulled.push(card);
            }

            await syncToCloud();
            renderResults(pulled);
        };

        function renderResults(cards) {
            const area = document.getElementById('pullResultsArea');
            const grid = document.getElementById('cardsGrid');
            area.classList.remove('hidden');
            grid.innerHTML = cards.map(c => `
                <div class="bg-slate-800 p-2 rounded-xl border border-slate-700 flex flex-col items-center">
                    <img src="${c.image}" class="w-full h-auto rounded-lg">
                    <span class="text-xs font-bold mt-1 text-slate-200">${c.name}</span>
                </div>
            `).join('');
        }

        window.renderBinder = () => {
            const setId = document.getElementById('binderSetFilter').value;
            const grid = document.getElementById('binderGrid');
            const cards = CARD_SETS[setId] || [];
            let unlocked = 0;

            grid.innerHTML = cards.map(c => {
                const count = currentUserDoc?.cards[c.id] || 0;
                if (count > 0) unlocked++;
                return count > 0 ? `
                    <div class="bg-slate-800 p-2 rounded-xl border border-slate-700 text-center">
                        <img src="${c.image}" class="w-full h-auto rounded-lg">
                        <span class="text-xs font-bold text-amber-400">×${count}</span>
                    </div>
                ` : `
                    <div class="bg-slate-900 aspect-[2/3] rounded-xl flex items-center justify-center card-locked border border-slate-800">
                        <i class="fa-solid fa-lock text-2xl text-slate-600"></i>
                    </div>
                `;
            }).join('');

            document.getElementById('binderProgressText').innerText = `${unlocked} / ${cards.length} (${Math.round(unlocked/cards.length*100)}%)`;
        };

        window.sellAllDuplicates = async () => {
            let total = 0;
            Object.values(CARD_SETS).flat().forEach(c => {
                const count = currentUserDoc.cards[c.id] || 0;
                if (count > 1) {
                    total += (count - 1) * RARITY[c.rarity].price;
                    currentUserDoc.cards[c.id] = 1;
                }
            });
            if (total === 0) return alert("目前沒有重複卡！");
            currentUserDoc.points += total;
            await syncToCloud();
            alert(`已售出重複卡，獲得 +${total} 分！`);
        };

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            if (tab === 'binder') renderBinder();
        };
    </script>
</body>
</html>
